    function renderInsight(){const data=aggregate();const e=data.distance?data.kwh/data.distance*100:0,f=data.distance?data.liters/data.distance*100:0;const compare=state.benchmarks.map(benchmark=>{const value=benchmark.kind==='electric'?benchmark.consumption*state.settings.electricPrice:benchmark.consumption*state.settings.fuelPrice;return{...benchmark,cost:value}});const max=Math.max(...compare.map(item=>item.cost),costPerKm(data)*100,1);const rank=[...data.trips].sort((a,b)=>tripDistance(b)-tripDistance(a));const longest=rank[0],durationRank=[...data.trips].sort((a,b)=>tripMinutes(b)-tripMinutes(a))[0],cheap=[...data.trips].filter(item=>tripDistance(item)>0).sort((a,b)=>tripEstimated(a)/tripDistance(a)-tripEstimated(b)/tripDistance(b))[0];$('#insightContent').innerHTML=`<article class="insight-box"><h2>${data.distance?'你的油电驾驶画像':'等待第一份数据'}</h2><div class="insight-kpis"><div><b>${e?e.toFixed(1):'--'}</b><span>kWh/100km</span></div><div><b>${f?f.toFixed(1):'--'}</b><span>L/100km</span></div><div><b>${data.distance?money(costPerKm(data)): '--'}</b><span>实际支出/km</span></div></div></article><article class="chart-card"><div class="chart-title"><b>本期行程里程</b><span>每一柱代表一趟</span></div><div class="chart"><svg viewBox="0 0 340 132" preserveAspectRatio="none">${barSvg(data.trips.map(item=>tripDistance(item)))}</svg></div><div class="axis"><span>较早</span><span>最近</span></div></article><article class="compare-card"><div class="compare-head"><b>同级成本基准</b><button id="editBenchmarks">编辑基准 ›</button></div><div class="compare-row" style="--width:${Math.max(4,costPerKm(data)*100/max*100)}%;--color:#3677f6"><span>我的钛7</span><i></i><em>${data.distance?money(costPerKm(data)*100)+'/100km':'待录入'}</em></div>${compare.map((item,index)=>`<div class="compare-row" style="--width:${item.cost/max*100}%;--color:${index===0?'#ec8a60':index===1?'#2eb995':'#929dab'}"><span>${esc(item.name)}</span><i></i><em>${money(item.cost)}/100km</em></div>`).join('')}<p class="compare-note">比较按当前电价 ${money(stat     function barSvg(values){if(!values.length)return'<path d="M8 118 H332" stroke="#dfe5ef" stroke-width="2"/><text x="170" y="65" text-anchor="middle" fill="#9aa4b3" font-size="11">录入行程后生成趋势</text>';const max=Math.max(...values,1),w=300/values.length;return values.map((value,index)=>{const height=Math.max(6,value/max*105),x=20+index*w,y=118-height;return`<rect x="${x}" y="${y}" width="${Math.max(8,w-8)}" height="${height}" rx="5" fill="${index===values.length-1?'#3677f6':'#b8d1ff'}"/>`}).join('')}

    function navTemplate(){return`<button class="on" data-tab="home">${icon('home')}首页</button><button data-tab="ledger">${icon('ledger')}账本</button><button data-tab="insight">${icon('chart')}洞察</button><button data-tab="service">${icon('service')}服务</button>`}function bindTabs(){$('.nav').innerHTML=navTemplate();document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>showPage(button.dataset.tab));document.querySelectorAll('[data-tabgo]').forEach(button=>button.onclick=()=>showPage(button.dataset.tabgo))}function bindNew(){document.querySelectorAll('[data-new]').forEach(button=>button.onclick=()=>openRecord(button.dataset.new));bindDetails();bindTabs()}function bindDetails(){document.querySelectorAll('[data-detail]').forEach(button=>button.onclick=()=>openDetail(button.dataset.detail));document.querySelectorAll('[data-tabgo]').forEach(button=>button.onclick=()=>showPage(button.dataset.tabgo))}function showPage(page){activePage=page;document.querySelectorAll('.page').forEach(item=>item.classList.toggle('active',item.dataset.page===page));document.querySelectorAll('[data-tab]').forEach(button=>button.classList.toggle('on',button.dataset.tab===page));$('.floating').style.display=page==='home'||page==='ledger'?'block':'none';render()}function render(){renderHome();renderLedger();renderInsight();renderService();bindTabs();$('.floating').innerHTML=`${icon('plus')}记录`;$('#openSettings').innerHTML=icon('setting');$('#openImport').innerHTML=icon('import');$('#openBenchmark').innerHTML=icon('chart');$('#exportData').innerHTML=icon('download');$('#openSettings').onclick=openSettings;$('#openImport').onclick=()=>$('#fileInput').click();$('#openBenchmark').onclick=openBenchmark;$('#exportData').onclick=exportData;document.querySelectorAll('[data-period]').forEach(button=>button.onclick=()=>{activePeriod=button.dataset.period;document.querySelectorAll('[data-period]').forEach(item=>item.classList.toggle('on',item===button));renderHome()});$('.floating').onclick     function fields(type,record={}){const input=(label,name,type='text',required=true,placeholder='')=>`<div class="field"><label>${label}</label><input ${required?'data-required':''} name="${name}" type="${type}" value="${esc(record[name]??(name==='date'?today():''))}" placeholder="${placeholder}"></div>`;if(type==='trip')return input('日期','date','date')+input('出发地','origin','text',true,'请输入')+input('目的地','destination','text',true,'请输入')+input('行驶里程','distance','number',true,'km')+input('驾驶时长','minutes','number',true,'分钟')+input('耗电','kwh','number',false,'kWh')+input('耗油','liters','number',false,'L')+input('路桥/停车','toll','number',false,'元');if(type==='charge')return input('日期','date','date')+input('充电站','place','text',false,'可选')+input('充入电量','energy','number',true,'kWh')+input('实际费用','amount','number',true,'元');if(type==='fuel')return input('日期','date','date')+input('加油站','place','text',false,'可选')+input('加油量','energy','number',true,'L')+input('实际费用','amount','number',true,'元');if(type==='parking')return input('日期','date','date')+`<div class="field"><label>停车地点</label><input data-required name="place" value="${esc(record.place||'')}" placeholder="请输入"><button class="location" type="button" id="locate">定位</button></div>`+input('开始时间','startTime','time',true)+input('结束时间','endTime','time',false)+input('停车费用','amount','number',false,'元');return `<div class="field"><label>类型</label><select name="type">${['care','insurance'].map(item=>`<option value="${item}" ${type===item?'selected':''}>${item==='care'?'洗车/养护':'保险'}</option>`).join('')}</select></div>`+input('日期','date','date')+input('项目','item','text',true,'洗车、保养等')+input('费用','amount','number',true,'元')+`<div class="field"><label>备注</label><textarea name="note" placeholder="可选">${esc(record.note||'')}</textarea></div>`}
    function openRecord(type='trip',record=null){draftType=type;editingId=record?.id||null;$('#sheet').innerHTML=`<div class="handle"></div><div class="sheet-top"><h2>${record?'编辑':'新增'}${typeLabel(type)}</h2><button class="close" id="closeSheet">×</button></div><p>保存前只修改草稿；取消不会影响已有数据。</p><div class="choices">${['trip','charge','fuel','parking','care'].map(item=>`<button data-choice="${item}" class="${type===item?'on':''}">${icon(typeIcon(item))}${typeLabel(item)}</button>`).join('')}</div><form id="recordForm" class="form">${fields(type,record||{})}</form><button class="save" id="saveRecord">保存到本地账本</button><button class="secondary" id="cancelSheet">取消</button>`;showOverlay();$('#closeSheet').onclick=hideOverlay;$('#cancelSheet').onclick=hideOverlay;document.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>openRecord(button.dataset.choice,record));$('#saveRecord').onclick=saveRecord;if(type==='parking'){$('#locate').onclick=getLocation}}

<script>
  (()=>{
    const drive=window.drivebook;
    if(!drive)return;
    const clamp=(value,min,max)=>Math.min(max,Math.max(min,Number(value)||0));
    const statusOf=()=>{
      const state=drive.state();
      if(!state.vehicleStatus){
        state.vehicleStatus={batteryCapacity:0,tankCapacity:0,batteryKwh:null,fuelLiters:null,lastSync:''};
        drive.save();
      }
      if(state.vehicleStatus.tankCapacity===undefined){
        Object.assign(state.vehicleStatus,{tankCapacity:Number(state.vehicleStatus.fuelCapacity||0),lastSync:state.vehicleStatus.lastChange||''});
        drive.save();
      }
      return state.vehicleStatus;
    };
    const percent=(amount,capacity)=>capacity>0&&amount!==null?Math.round(clamp(amount/capacity*100,0,100)):null;
    const quantity=(value,unit)=>value===null?'待校准':`${Number(value).toFixed(1)} ${unit}`;
    const statusCard=()=>{
      const status=statusOf();
      const electricity=percent(status.batteryKwh,status.batteryCapacity);
      const fuel=percent(status.fuelLiters,status.tankCapacity);
      return`<div class="section vehicle-section"><h2>车况</h2><button data-vehicle-status>校准数据 ›</button></div><article class="vehicle-status" data-vehicle-status><div class="vehicle-status-head"><span>钛7能量状态</span><small>${status.lastSync||'设置容量与当前余量后自动同步'}</small></div><div class="vehicle-levels"><section class="vehicle-level electric"><div class="vehicle-icon">${icon('plug')}</div><span>电池剩余</span><b>${electricity===null?'--':electricity+'%'}</b><em>${quantity(status.batteryKwh,'kWh')} / ${status.batteryCapacity||'--'} kWh</em><i><strong style="width:${electricity===null?0:electricity}%"></strong></i></section><section class="vehicle-level fuel"><div class="vehicle-icon">${icon('fuel')}</div><span>燃油剩余</span><b>${fuel===null?'--':fuel+'%'}</b><em>${quantity(status.fuelLiters,'L')} / ${status.tankCapacity||'--'} L</em><i><strong style="width:${fuel===null?0:fuel}%"></strong></i></section></div><p>保存行程后按记录耗电/耗油扣减；保存充电或加油后自动补回。点击可校准。</p></article>`;
    };
    function addStatusCard(){
      const host=$('#homeContent');
      if(!host||host.querySelector('.vehicle-status'))return;
      const anchor=host.querySelector('.overview');
      if(anchor)anchor.insertAdjacentHTML('afterend',statusCard());
      host.querySelectorAll('[data-vehicle-status]').forEach(button=>button.onclick=openVehicleStatus);
    }
    function openVehicleStatus(){
      const status=statusOf();
      const electricity=percent(status.batteryKwh,status.batteryCapacity);
      const fuel=percent(status.fuelLiters,status.tankCapacity);
      $('#sheet').innerHTML=`<div class="handle"></div><div class="sheet-top"><h2>校准车况</h2><button class="close" id="closeVehicleStatus">×</button></div><p>填写电池/油箱可用容量与当前仪表百分比。之后每次保存行程、充电或加油，会按本条记录自动同步。</p><div class="form vehicle-form"><div class="field"><label>电池可用容量</label><input data-status-required name="batteryCapacity" type="number" min="0.1" step="0.1" value="${status.batteryCapacity||''}" placeholder="例如 36"><span>kWh</span></div><div class="field"><label>当前电量</label><input data-status-required name="batteryPercent" type="number" min="0" max="100" step="1" value="${electricity??''}" placeholder="仪表百分比"><span>%</span></div><div class="field"><label>油箱可用容量</label><input data-status-required name="tankCapacity" type="number" min="0.1" step="0.1" value="${status.tankCapacity||''}" placeholder="例如 60"><span>L</span></div><div class="field"><label>当前油量</label><input data-status-required name="fuelPercent" type="number" min="0" max="100" step="1" value="${fuel??''}" placeholder="仪表百分比"><span>%</span></div></div><button class="save" id="saveVehicleStatus">保存并校准</button><button class="secondary" id="cancelVehicleStatus">取消</button>`;
      showOverlay();
      $('#closeVehicleStatus').onclick=hideOverlay;
      $('#cancelVehicleStatus').onclick=hideOverlay;
      $('#saveVehicleStatus').onclick=()=>{
        const batteryCapacity=Number($('[name="batteryCapacity"]').value),batteryPercent=Number($('[name="batteryPercent"]').value),tankCapacity=Number($('[name="tankCapacity"]').value),fuelPercent=Number($('[name="fuelPercent"]').value);
        const invalid=[batteryCapacity<=0,batteryPercent<0||batteryPercent>100,tankCapacity<=0,fuelPercent<0||fuelPercent>100];
        [...document.querySelectorAll('[data-status-required]')].forEach((input,index)=>input.classList.toggle('error',invalid[index]||!input.value));
        if(invalid.some(Boolean)||[batteryCapacity,batteryPercent,tankCapacity,fuelPercent].some(value=>!Number.isFinite(value))){notice('请补齐并检查标红的车况数据');return}
        Object.assign(status,{batteryCapacity,tankCapacity,batteryKwh:batteryCapacity*batteryPercent/100,fuelLiters:tankCapacity*fuelPercent/100,lastSync:'刚刚手动校准'});
        drive.save();hideOverlay();drive.refresh();notice('车况已校准，后续记录会自动同步');
      };
    }
    function syncRecordChange(before){
      const state=drive.state(),status=statusOf();
      let electricDelta=0,fuelDelta=0,changed=false;
      state.records.forEach(record=>{
        const previous=before.get(record.id);
        if(previous&&previous.updatedAt===record.updatedAt)return;
        if(!['trip','charge','fuel'].includes(record.type))return;
        changed=true;
        const oldElectric=Number(previous?.kwh||previous?.energy||0),oldFuel=Number(previous?.liters||previous?.energy||0);
        if(record.type==='trip'){
          electricDelta-=Number(record.kwh||0)-Number(previous?.kwh||0);
          fuelDelta-=Number(record.liters||0)-Number(previous?.liters||0);
        }
        if(record.type==='charge')electricDelta+=Number(record.energy||0)-(previous?oldElectric:0);
        if(record.type==='fuel')fuelDelta+=Number(record.energy||0)-(previous?oldFuel:0);
      });
      if(!changed||(electricDelta===0&&fuelDelta===0))return;
      if(status.batteryCapacity>0&&status.batteryKwh!==null)status.batteryKwh=clamp(Number(status.batteryKwh)+electricDelta,0,status.batteryCapacity);
      if(status.tankCapacity>0&&status.fuelLiters!==null)status.fuelLiters=clamp(Number(status.fuelLiters)+fuelDelta,0,status.tankCapacity);
      const electricText=electricDelta?`电量 ${electricDelta>0?'+':'-'}${Math.abs(electricDelta).toFixed(1)} kWh`:'';
      const fuelText=fuelDelta?`燃油 ${fuelDelta>0?'+':'-'}${Math.abs(fuelDelta).toFixed(1)} L`:'';
      status.lastSync=(status.batteryCapacity>0&&status.tankCapacity>0)?`刚刚同步：${[electricText,fuelText].filter(Boolean).join(' · ')}`:'记录已保存，待校准车况';
      drive.save();drive.refresh();notice(status.lastSync);
    }
    document.addEventListener('click',event=>{
      const saveButton=event.target.closest('#saveRecord');
      if(!saveButton)return;
      const before=new Map(drive.state().records.map(record=>[record.id,{...record}]));
      window.setTimeout(()=>syncRecordChange(before),0);
    },true);
    document.addEventListener('input',event=>{
      if(event.target.matches('[data-status-required]')&&event.target.value)event.target.classList.remove('error');
    });
    const homeObserver=new MutationObserver(addStatusCard);
    homeObserver.observe($('#homeContent'),{childList:true});
    const style=document.createElement('style');
    style.textContent='.vehicle-section{margin-top:18px}.vehicle-status{margin-top:-2px;border-radius:20px;padding:15px;background:linear-gradient(135deg,#f1f7ff,#fbfdfd);border:1px solid #e1ebf6;box-shadow:0 5px 14px rgba(42,67,102,.035);text-align:left}.vehicle-status-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.vehicle-status-head span{font-size:14px;font-weight:800}.vehicle-status-head small{max-width:185px;font-size:9px;line-height:1.35;text-align:right;color:#8090a5}.vehicle-levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.vehicle-level{border-radius:15px;padding:11px;background:rgba(255,255,255,.78);position:relative}.vehicle-level.fuel{background:#fff8ef}.vehicle-icon{position:absolute;right:10px;top:10px;width:20px;height:20px;color:#4f81d8}.vehicle-level.fuel .vehicle-icon{color:#de9368}.vehicle-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}.vehicle-level span,.vehicle-level em{display:block;font-style:normal;color:#8190a2}.vehicle-level span{font-size:10px}.vehicle-level b{display:block;font-size:25px;letter-spacing:-1.2px;margin:4px 0}.vehicle-level em{font-size:9px;white-space:nowrap}.vehicle-level i{display:block;height:6px;background:#dce8f7;border-radius:99px;overflow:hidden;margin-top:10px}.vehicle-level.fuel i{background:#f6e4cf}.vehicle-level i strong{display:block;height:100%;background:#4d89e8;border-radius:99px}.vehicle-level.fuel i strong{background:#e5a06d}.vehicle-status>p{font-size:9px;line-height:1.45;color:#7d8da1;margin:11px 0 0}.vehicle-form{margin-top:12px}';
    document.head.appendChild(style);
    addStatusCard();
  })();
</script>
<script>
  (()=>{
    const drive=window.drivebook;
    if(!drive)return;
    const referenceDefaults=[
      {id:'bao5',name:'方程豹 豹5（亏电）',kind:'fuel',consumption:10,source:'公开实测与车主平均参考；亏电工况'},
      {id:'su7',name:'小米 SU7 Max',kind:'electric',consumption:15,source:'公开能耗与车主平均参考；15 kWh/100km'},
      {id:'xingyue-l',name:'吉利 星越L',kind:'fuel',consumption:8,source:'公开实测与车主平均参考；8 L/100km'},
      {id:'bmw-320',name:'宝马 320Li',kind:'fuel',consumption:7.5,source:'公开实测与车主平均参考；7.5 L/100km'}
    ];
    const palette=['#ed8b63','#2fb995','#5d8fe8','#8a73d6','#7e8b9c'];
    const fmt=value=>`¥${Math.abs(Number(value||0)).toFixed(1)}`;
    const signed=value=>`${value>=0?'+':'-'}${fmt(value)}`;
    const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const referenceCost=(distance,item,state)=>distance*Number(item.consumption||0)/100*(item.kind==='electric'?state.settings.electricPrice:state.settings.fuelPrice);
    const periodLabel=period=>({day:'今日',week:'本周',month:'本月',year:'本年'})[period]||'本期';
    function migrateReferences(){
      const state=drive.state();
      let changed=false;
      referenceDefaults.forEach(defaultItem=>{
        const existing=state.benchmarks.find(item=>item.id===defaultItem.id);
        if(existing){
          if(existing.id==='bao5'||existing.id==='su7')Object.assign(existing,defaultItem);
        }else{state.benchmarks.push({...defaultItem});changed=true}
      });
      if(changed||state.benchmarks.some(item=>item.id==='bao5'&&Number(item.consumption)!==10)||state.benchmarks.some(item=>item.id==='su7'&&Number(item.consumption)!==15)){drive.save();drive.refresh()}
    }
    function comparisonData(list){
      const state=drive.state();
      const trips=list.filter(item=>item.type==='trip');
      const distance=trips.reduce((sum,item)=>sum+Number(item.distance||0),0);
      const kwh=trips.reduce((sum,item)=>sum+Number(item.kwh||0),0);
      const liters=trips.reduce((sum,item)=>sum+Number(item.liters||0),0);
      const ownCost=kwh*state.settings.electricPrice+liters*state.settings.fuelPrice;
      const ownConsumption=distance?`${(kwh/distance*100).toFixed(1)} kWh + ${(liters/distance*100).toFixed(1)} L`:'待录入';
      return{state,trips,distance,kwh,liters,ownCost,ownConsumption};
    }
    window.openComparisonDetail=options=>{
      const isTrip=options.scope==='trip';
      const list=isTrip?[options.record]:drive.records(drive.period());
      const data=comparisonData(list);
      const {state,distance,ownCost,ownConsumption}=data;
      const compare=state.benchmarks.map((item,index)=>({...item,cost:referenceCost(distance,item,state),color:palette[index%palette.length]}));
      const max=Math.max(ownCost,...compare.map(item=>item.cost),1);
      const title=isTrip?'单次行程成本对比':`${periodLabel(drive.period())}里程成本对比`;
      const subtitle=isTrip?`${safe(options.record.origin||'未命名起点')} → ${safe(options.record.destination||'未命名终点')}`:`${data.trips.length} 趟行程 · 以同距 ${distance.toFixed(1)} km 换算`;
      const ownWidth=Math.max(5,ownCost/max*100);
      const rows=compare.map(item=>{
        const delta=item.cost-ownCost;
        return`<article class="comparison-row"><div class="comparison-name"><span style="background:${item.color}"></span><b>${safe(item.name)}</b><em>${item.kind==='electric'?`${item.consumption} kWh/100km`:`${item.consumption} L/100km`}</em></div><div class="comparison-bar"><i style="width:${Math.max(5,item.cost/max*100)}%;background:${item.color}"></i></div><div class="comparison-value"><b>${fmt(item.cost)}</b><span class="${delta>=0?'gain':'loss'}">${signed(delta)}${delta>=0?' 可省':' 多花'}</span></div><p>${safe(item.source||'参考口径可在基准设置中修改')}</p></article>`;
      }).join('');
      $('#sheet').innerHTML=`<div class="handle"></div><div class="sheet-top"><h2>${title}</h2><button class="close" id="closeComparison">×</button></div><p>${subtitle}</p>${distance?`<section class="comparison-hero"><span>钛7实际能耗成本</span><b>${fmt(ownCost)}</b><small>${distance.toFixed(1)} km · ${ownConsumption}/100km</small><div><i style="width:${ownWidth}%"></i></div><strong>差额 = 对比车型同距成本 − 钛7实际能耗成本</strong></section><section class="comparison-list"><article class="comparison-row own"><div class="comparison-name"><span></span><b>我的钛7</b><em>实际记录</em></div><div class="comparison-bar"><i style="width:${ownWidth}%"></i></div><div class="comparison-value"><b>${fmt(ownCost)}</b><span>基准</span></div><p>仅计算行程油电能耗；路桥、停车等公共费用不纳入车型比较。</p></article>${rows}</section>`:`<div class="empty">暂无行程里程。录入至少一趟行程后，即可查看同距成本与节省差额。</div>`}<button class="save" id="manageComparison">管理车型基准</button>${isTrip?`<button class="secondary" id="editComparison">编辑本条行程</button><button class="secondary danger" id="deleteComparison">删除本条行程</button>`:''}`;
      showOverlay();
      $('#closeComparison').onclick=hideOverlay;
      $('#manageComparison').onclick=openBenchmark;
      if(isTrip){
        $('#editComparison').onclick=()=>openRecord('trip',options.record);
        $('#deleteComparison').onclick=()=>{
          if(!confirm('确定删除这条记录？'))return;
          state.records=state.records.filter(item=>item.id!==options.record.id);
          drive.save();hideOverlay();drive.refresh();notice('记录已删除');
        };
      }
    };
    function addPeriodEntry(){
      const host=$('#insightContent');
      if(!host||host.querySelector('[data-comparison-period]'))return;
      host.insertAdjacentHTML('beforeend','<button class="comparison-entry" data-comparison-period><span>同距成本详情</span><b>展开本期对比</b><i>›</i></button>');
      host.querySelector('[data-comparison-period]').onclick=()=>openComparisonDetail({scope:'period'});
    }
    const insightObserver=new MutationObserver(addPeriodEntry);
    insightObserver.observe($('#insightContent'),{childList:true});
    document.addEventListener('click',event=>{
      const target=event.target.closest('[data-detail]');
      if(!target)return;
      const record=drive.state().records.find(item=>item.id===target.dataset.detail);
      if(!record||record.type!=='trip')return;
      event.preventDefault();event.stopImmediatePropagation();
      openComparisonDetail({scope:'trip',record});
